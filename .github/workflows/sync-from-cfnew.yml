name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "正在获取最新发布信息..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: cfnew-auto-sync" \
            "https://api.github.com/repos/byJoey/cfnew/releases/latest" \
            -o release.json

          VERSION=$(jq -r '.tag_name // empty' release.json)
          ASSETS_URL=$(jq -r '.assets_url // empty' release.json)

          if [ -z "$VERSION" ] || [ -z "$ASSETS_URL" ]; then
            echo "错误：GitHub API 未返回有效的 tag_name/assets_url"
            cat release.json
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "最新版本: $VERSION"
          echo "正在获取文件列表..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: cfnew-auto-sync" \
            "$ASSETS_URL" \
            -o assets.json

          DOWNLOAD_URL=$(jq -r '.[] | select((.name | ascii_downcase) == "pages.zip") | .browser_download_url' assets.json | head -1)
          FILE_NAME="Pages.zip"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到 Pages.zip 文件"
            echo "可用的文件列表："
            jq -r '.[].name | "  - \(.)"' assets.json
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "下载 URL: $DOWNLOAD_URL"
          echo "文件名: $FILE_NAME"

      - name: 检查当前版本
        id: check_version
        run: |
          set -euo pipefail

          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建空版本状态"
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(tr -d '\n\r ' < VERSION.txt)
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本: ${CURRENT_VERSION:-<空>}"
          echo "最新版本: $NEW_VERSION"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"

          echo "正在下载文件: $FILE_NAME"
          curl -fL --retry 3 --retry-delay 2 -o "$FILE_NAME" "$DOWNLOAD_URL"

          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d .
          rm -f "$FILE_NAME" release.json assets.json

          echo "$VERSION" > VERSION.txt
          test -s VERSION.txt
          echo "版本记录已更新: $VERSION"

      - name: 清理临时 API 文件
        if: always()
        run: |
          rm -f release.json assets.json Pages.zip

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        if: always()
        run: |
          echo "## 同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> "$GITHUB_STEP_SUMMARY"
          fi
